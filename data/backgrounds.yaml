# 背景元数据（人工核对，不随生成物覆盖）
#
# 所有者交付的背景 SVG 没有 in-artwork 的 `id="board-area"` 标记，因此板书区
# 在这里显式登记，导入时写入 assets/manifest.yaml 的 `regions.board`。
# 坐标系为 1920×1080 逻辑画布，必须落在对话框（约 y≥745）之上。
classroom_blackboard:
  # 黑板漆面在原图里是 x=84 y=54 w=1752 h=832；内缩以避开木框和对话框，
  # 并把右侧留给讲师立绘，避免公式与人脸重叠。
  regions:
    board: [110, 92, 1180, 600]
