unit: stage1/l1/s06
defaults:
  bg: classroom_wide
cues:
  - at: { id: "stage1/l1/s06#0000", anchor: "杨秉到目前为止我们已经掌握了把假" }
    do:
      - { cmd: "bg", id: "classroom_blackboard", transition: "fade", ms: 450 }
      - { cmd: "show", char: "yang-bing", expr: "neutral", slot: "center" }
  - at: { id: "stage1/l1/s06#0001", anchor: "史姝起身我叫史姝" }
    do:
      - { cmd: "show", char: "shi-shu", expr: "neutral", slot: "right" }
  - at: { id: "stage1/l1/s06#0010", anchor: "杨秉你的直觉是对的请坐吧我们这次" }
    do:
      - { cmd: "expr", char: "yang-bing", expr: "smile" }
  - at: { id: "stage1/l1/s06#0014", anchor: "杨秉对了请坐吧现在我们来分析一下" }
    do:
      - { cmd: "expr", char: "yang-bing", expr: "neutral" }
  - at: { id: "stage1/l1/s06#0015", anchor: "赵超起身我叫赵超" }
    do:
      - { cmd: "show", char: "zhao-chao", expr: "neutral", slot: "left" }
  - at: { id: "stage1/l1/s06#0026", anchor: "牛弘敲电脑这个就不用你算了我直接" }
    do:
      - { cmd: "hide", char: "yang-bing" }
      - { cmd: "show", char: "niu-hong", expr: "neutral", slot: "center" }
  - at: { id: "stage1/l1/s06#0028", anchor: "杨秉好虽然中途有点小失误但最后还" }
    do:
      - { cmd: "hide", char: "shi-shu" }
      - { cmd: "show", char: "yang-bing", expr: "neutral", slot: "right" }
