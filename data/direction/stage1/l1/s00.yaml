      - { cmd: "hide", char: "yan-pei" }
  - at: { id: "stage1/l1/s00#0004", anchor: "温舒站起来面朝向大家鞠了个躬He" }
    do:
      - { cmd: "show", char: "wen-shu", expr: "neutral", slot: "center" }
  - at: { id: "stage1/l1/s00#0006", anchor: "牛弘你慢慢讲都行他这节课肯定回不" }
    do:
      - { cmd: "show", char: "niu-hong", expr: "neutral", slot: "left" }
