      - { cmd: "bg", id: "classroom_blackboard", transition: "fade", ms: 450 }
      - { cmd: "show", char: "yan-pei", expr: "neutral", slot: "center" }
  - at: { id: "stage1/l2/s04#0001", anchor: "沈嗣起身我记得这种问题好像是通过" }
