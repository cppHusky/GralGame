name: CI and deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gralgame-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout (including book submodule)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 12.17.0
          cache: true

      - name: Set up Python for WOFF2 font tools
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"

      - name: Cache Typst packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/typst
          key: typst-${{ runner.os }}-${{ hashFiles('.typst-version') }}
          restore-keys: typst-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Typst
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/typst"
          curl -fsSL https://github.com/typst/typst/releases/download/v0.15.0/typst-x86_64-unknown-linux-musl.tar.xz \
            | tar -xJ --strip-components=1 -C "$RUNNER_TEMP/typst"
          "$RUNNER_TEMP/typst/typst" --version
          echo "TYPST_BIN=$RUNNER_TEMP/typst/typst" >> "$GITHUB_ENV"

      - name: Build script and app
        run: pnpm build

      - name: Run checks
        run: pnpm check

      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run end-to-end checks
        run: pnpm e2e

      # Avoid exposing Cloudflare secrets to untrusted pull-request code.
      - name: Deploy to Workers Static Assets
        if: github.event_name == 'push' && github.ref_type == 'branch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::notice::Cloudflare secrets are not configured; deployment skipped."
            exit 0
          fi
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            pnpm exec wrangler deploy
          else
            pnpm exec wrangler deploy --name gralgame-staging
          fi
