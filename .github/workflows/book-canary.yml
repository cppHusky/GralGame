name: Book canary

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout pinned project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 12.17.0
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Typst
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/typst"
          curl -fsSL https://github.com/typst/typst/releases/download/v0.15.0/typst-x86_64-unknown-linux-musl.tar.xz \
            | tar -xJ --strip-components=1 -C "$RUNNER_TEMP/typst"
          echo "TYPST_BIN=$RUNNER_TEMP/typst/typst" >> "$GITHUB_ENV"

      - name: Build against book main
        shell: bash
        run: |
          git -C book fetch origin main
          git -C book checkout --detach FETCH_HEAD
          pnpm build:script
          pnpm check:ir
          pnpm check:direction
          pnpm check:assets
